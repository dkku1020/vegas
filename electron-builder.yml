appId: com.vegas.baccarat-simulator
productName: Baccarat Simulator
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
mac:
  category: public.app-category.card-games
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
